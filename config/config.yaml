/cuda_cone_fused_node:
  ros__parameters:
    generic:
      is_colorblind: true
      
      output_frame_id: "track"
      output_child_frame_id: "imu_link"

      imu_topic: "/imu/data"  # or /lidar_imu       # WIP
      cones_topic: "/clusters"
      input_odom_topic: "/fast_limo/state"
      race_status_topic: "/planning/race_status"
      
      mapped_cones_topic: "/slam/cones_positions"
      output_odom_topic: "/Odometry"

      enable_logging: true
      cone_time_seen_th: 10
      is_skidpad_mission: false

      # --- DEBUG-only parameters -------------------------------------------
      # The following take effect ONLY in a debug build (cmake -DDEBUG=ON, which
      # defines CONE_FUSED_DEBUG). In a normal build they are compiled out and
      # ignored, so the debug publishers/topics never exist on the wire.

      # Keep republishing the live map even after the corrected map is frozen,
      # so the raw (lap-1) vs. corrected map can be compared.
      cones_pub_for_debug: true

      # Publish the raw input cones projected into the map frame via the
      # current EKF pose, as RED markers, to compare live observations vs. the map.
      pub_input_cones_debug: true
      input_cones_debug_topic: "/slam/input_cones_debug"
      # ---------------------------------------------------------------------

      # Cone correction mode is fixed at build time, not here: a GPU build
      # (cmake -DUSE_CUDA=ON) always uses the joint update fusing all associated
      # cones in one EKF step; a CPU-only build always uses the single-cone path.

      # Map handling from lap 2 onward:
      #   true  = freeze the map: rigid pose-only localization (landmarks fixed,
      #           global gauge locked, no slow map rotation). Recommended.
      #   false = continuous SLAM: keep correcting pose AND landmark positions
      #           (legacy behavior; refines the map but can let it slowly rotate).
      # Note: no NEW cones are added after lap 1 in either mode; "continuous" only
      # refines the positions of cones already mapped in lap 1.
      freeze_map: false   # probably should be true for the final version, but false is useful for debugging and testing

      # Lap 1 always runs full EKF-SLAM: the cones correct the pose while the map
      # is built, so FAST-LIMO drift is anchored as we go (FAST-LIMO cannot yet be
      # trusted on its own). This is no longer optional.

      # Lap-2+ data association: a cone associates to the nearest mapped landmark
      # only if its Mahalanobis distance d^2 = nu^T S^-1 nu is below this gate
      # (chi-square, 2 DOF: 5.99=95%, 9.21=99%, 13.8=99.9%). Replaces the fixed
      # Euclidean radius so the capture region adapts to pose uncertainty. Raise
      # to keep correcting under larger drift; lower to reject more aggressively.
      assoc_maha_gate: 13.8

      # Eigen/OpenMP threads for the CPU linear algebra. Default 1: at these
      # matrix sizes multithreaded GEMM mostly adds fork/join jitter (p99 latency
      # blows up at 6 threads on the Orin's 6-core SoC). With the GPU backend
      # (-DUSE_CUDA=ON) the heavy work is offloaded, so this only affects the CPU
      # (debug) build. Try 2 if profiling a CPU-only build of a full-size map.
      eigen_threads: 1

    noises:
      proc_noise:  [0.7, 0.3]             # (range, bearing) measurement noise: sigma range [m], sigma bearing [rad]

      # Motion process noise (the Q of the predict step), added to the pose
      # covariance each step proportional to motion: [pos per metre travelled
      # [m^2/m], yaw per radian turned [rad^2/rad]]. This stops P from collapsing
      # to ~0 over the laps (which makes the EKF overconfident in fast_limo and
      # lets the Mahalanobis gate reject valid cones -> late-lap divergence).
      # Raise if the gate starts rejecting good cones / drift accumulates; lower
      # if the pose gets jittery. [0.0, 0.0] disables it.
      motion_noise: [0.05, 0.02]

      min_new_cone_distance: 1.7          # Minimum distance to create new cone
